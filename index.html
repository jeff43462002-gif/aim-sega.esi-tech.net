<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>活動感謝頁面</title>
  <style>
    /* 全局樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      padding-top: 200px;
      position: relative;
      background-color: #9B7800; /* 底層金黃色 */
      overflow-x: hidden;
    }

    /* 背景幾何拼圖容器 */
    .bg-puzzle {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* 1. 紫色：左上區塊 */
    .shape-purple {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #7B4C6E;
      clip-path: polygon(0 0, 32% 0, 78% 15%, 0 28%);
    }

    /* 2. 紅色：頂部倒三角形 */
    .shape-red {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #923447;
      clip-path: polygon(32% 0, 96% 0, 78% 15%,50% 25%);
    }

    /* 3. 藍綠色：左側斜線區塊 */
    .shape-teal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #007D8A;
      clip-path: polygon(0 28%, 78% 15%, 0 78%);
    }

    /* 白色卡片主體 */
    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 4px;
      padding: 32px 20px 28px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* 圖片外層：下方留白拉開與文字間距 */
    .image-wrapper {
      width: 100%;
      max-width: 210px;
      margin: 0 auto;
      margin-bottom: 24px; /* 圖片與文字中間的 padding/margin */
    }

    /* 圖片本體 */
    .event-image {
      width: 100%;
      height: auto;
      border-radius: 0;
      display: block;
    }

    /* 標題文字樣式：下方留白拉開與按鈕間距 */
    .title {
      font-size: 26px;
      font-weight: bold;
      color: #585858;
      line-height: 1.35;
      margin-top: 0;
      margin-bottom: 32px; /* 文字與按鈕中間的 padding/margin */
      letter-spacing: 0.5px;
    }

    /* 按鈕容器 */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* 按鈕樣式 */
    .btn {
      display: block;
      width: 58%;
      margin: 0 auto;
      padding: 11px 0;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #A03E1F;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #883318;
    }
  </style>
</head>
<body>

  <!-- 幾何拼圖背景 -->
  <div class="bg-puzzle">
    <div class="shape-purple"></div>
    <div class="shape-red"></div>
    <div class="shape-teal"></div>
  </div>

  <!-- 卡片主體 -->
  <div class="card-container">
    <div class="image-wrapper">
      <img src="https://aimsega.blob.core.windows.net/$web/194716ab-ecf4-46d5-9d0f-e36853f81652" alt="活動海報" class="event-image">
    </div>

    <!-- 標題與精準換行 -->
    <h1 class="title">感謝您的參加！祝你獲得好成績！</h1>

    <div class="button-group">
      <a href="https://line.me/R/ti/p/@338ffunl" class="btn">回到官方帳號</a>
      <a href="https://aim-sega.esi-tech.net/Content/LIFFRewardList/LIFFRewardList.html?channelid=e412ac5c-4aa6-4c93-b769-1c5de85e9f58&v=20260908101944990&app=2000424447-7yV2aGo9&liff.referrer=https%3A%2F%2Faim-sega.esi-tech.net%2F" class="btn">我的中獎清單</a>
    </div>
  </div>

</body>
</html>
